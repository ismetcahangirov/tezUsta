name: CI

on:
  push:
    branches: [main]
  # Deliberately NOT filtered to `branches: [main]`. EPIC 2 is delivered as a
  # stack of dependent pull requests — each one based on the previous branch
  # rather than on `main`, because it needs code the previous one introduces.
  # A base-branch filter means every PR in such a stack reports "no checks
  # reported" and merges into its parent unverified, so the gate only ever runs
  # on the last one. Observed on #53, which opened green with nothing having
  # run. The filter saved nothing: a push to a branch with no PR does not
  # trigger this event at all.
  pull_request:
  # docs/engineering/security.md § Dependencies requires the audit to run on a
  # schedule, not only on a PR: an advisory published after a merge would
  # otherwise go unnoticed until the next change.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .nvmrc and package.json engines.
  NODE_VERSION: '24'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The scheduled run exists for the audit job; re-running the full verify
    # gate against an unchanged tree would prove nothing.
    if: github.event_name != 'schedule'

    services:
      # Integration tests run against real Postgres + PostGIS. Mocking the
      # database would not exercise the spatial queries, which is where the
      # risk is (docs/engineering/testing-strategy.md).
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tezusta
          POSTGRES_PASSWORD: tezusta
          POSTGRES_DB: tezusta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tezusta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tezusta:tezusta@localhost:5432/tezusta_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # Test-only signing keys. `AuthModule` refuses to start without them
      # (EPIC 2), so the whole job needs a pair; they sign nothing that leaves
      # the runner. They must differ from each other — env.schema.ts rejects a
      # shared secret — and they are not secrets, so they belong here in plain
      # sight rather than in repository secrets, where a reader would assume
      # they guarded something.
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdefghijklmnop
      JWT_REFRESH_SECRET: ci-only-refresh-secret-zyxwvutsrqponmlkjihgfedcba

    steps:
      # Action versions are pinned to majors whose own runtime is node24.
      # `actions/*@v4` and `pnpm/action-setup@v4` declare `using: node20`, which
      # GitHub currently forces onto Node 24 while printing a deprecation
      # annotation; when that grace period ends those steps fail and every job
      # here — the architecture gate and the dependency audit included — stops
      # running (issue #48).
      #
      # `pnpm/action-setup@v6` is the first major that supports pnpm v11, which
      # is what `packageManager` in the root package.json declares. It carries
      # no `version:` input on purpose: the action reads `packageManager`, and a
      # number repeated here is a number that can disagree with the lockfile.
      #
      # The ORDER below is load-bearing and must stay: `setup-node`'s
      # `cache: pnpm` shells out to pnpm to find the store, so pnpm has to be on
      # PATH before it runs.
      #
      # `NODE_VERSION` and `.nvmrc` are a different question — they are the Node
      # the project runs on, not the Node these actions execute on.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: a dependency must not drift between local and CI.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Required gate, not advisory. This is what makes the architecture
      # boundaries in .dependency-cruiser.cjs real (ADR-0006).
      - name: Validate architecture boundaries
        run: pnpm graph:validate

      # The committed graph is what an agent reads instead of crawling the
      # repository (tools/project-graph/README.md). A stale one is worse than
      # none, because it is trusted. The generator emits no timestamp, so this
      # diff is empty unless the source tree actually moved.
      - name: Check the committed project graph is current
        run: pnpm graph:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level high
