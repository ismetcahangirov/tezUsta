name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .nvmrc and package.json engines.
  NODE_VERSION: '24'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Integration tests run against real Postgres + PostGIS. Mocking the
      # database would not exercise the spatial queries, which is where the
      # risk is (docs/engineering/testing-strategy.md).
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tezusta
          POSTGRES_PASSWORD: tezusta
          POSTGRES_DB: tezusta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tezusta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tezusta:tezusta@localhost:5432/tezusta_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: a dependency must not drift between local and CI.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Required gate, not advisory. This is what makes the architecture
      # boundaries in .dependency-cruiser.cjs real (ADR-0006).
      - name: Validate architecture boundaries
        run: pnpm graph:validate

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level high
