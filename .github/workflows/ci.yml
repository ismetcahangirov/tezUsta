name: CI

on:
  push:
    branches: [main]
  # Deliberately NOT filtered to `branches: [main]`. EPIC 2 is delivered as a
  # stack of dependent pull requests — each one based on the previous branch
  # rather than on `main`, because it needs code the previous one introduces.
  # A base-branch filter means every PR in such a stack reports "no checks
  # reported" and merges into its parent unverified, so the gate only ever runs
  # on the last one. Observed on #53, which opened green with nothing having
  # run. The filter saved nothing: a push to a branch with no PR does not
  # trigger this event at all.
  pull_request:
  # docs/engineering/security.md § Dependencies requires the audit to run on a
  # schedule, not only on a PR: an advisory published after a merge would
  # otherwise go unnoticed until the next change.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .nvmrc and package.json engines.
  NODE_VERSION: '24'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The scheduled run exists for the audit job; re-running the full verify
    # gate against an unchanged tree would prove nothing.
    if: github.event_name != 'schedule'

    services:
      # Integration tests run against real Postgres + PostGIS. Mocking the
      # database would not exercise the spatial queries, which is where the
      # risk is (docs/engineering/testing-strategy.md).
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tezusta
          POSTGRES_PASSWORD: tezusta
          POSTGRES_DB: tezusta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tezusta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The call media server (issue #184). `livekit-call-media.provider.test.ts`
      # runs its contract against a real one, because the only thing the stub
      # cannot prove is that LiveKit accepts what the adapter mints. Same tag
      # as docker-compose.yml.
      #
      # Configured by environment alone: a service container cannot take a
      # `command:`, and the binary reads its key pair from `LIVEKIT_KEYS`
      # (`cmd/server/main.go`, flag `keys`). Only the HTTP/WebSocket port is
      # published — the suite signals over it and never negotiates media.
      livekit:
        image: livekit/livekit-server:v1.13.7
        env:
          LIVEKIT_KEYS: 'devkey: devsecret-tezusta-local-only-0123456789'
        ports: ['7880:7880']
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:7880"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tezusta:tezusta@localhost:5432/tezusta_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # Test-only signing keys. `AuthModule` refuses to start without them
      # (EPIC 2), so the whole job needs a pair; they sign nothing that leaves
      # the runner. They must differ from each other — env.schema.ts rejects a
      # shared secret — and they are not secrets, so they belong here in plain
      # sight rather than in repository secrets, where a reader would assume
      # they guarded something.
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdefghijklmnop
      JWT_REFRESH_SECRET: ci-only-refresh-secret-zyxwvutsrqponmlkjihgfedcba
      # The committed development pair the `livekit` service above runs with
      # — not a secret, and refused by env.schema.ts under NODE_ENV=production.
      # `CALLS_PROVIDER` stays `stub` for every suite that boots the app; only
      # the LiveKit adapter's own suite reads these.
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-tezusta-local-only-0123456789

    steps:
      # Action versions are pinned to majors whose own runtime is node24.
      # `actions/*@v4` and `pnpm/action-setup@v4` declare `using: node20`, which
      # GitHub currently forces onto Node 24 while printing a deprecation
      # annotation; when that grace period ends those steps fail and every job
      # here — the architecture gate and the dependency audit included — stops
      # running (issue #48).
      #
      # `pnpm/action-setup@v6` is the first major that supports pnpm v11, which
      # is what `packageManager` in the root package.json declares. It carries
      # no `version:` input on purpose: the action reads `packageManager`, and a
      # number repeated here is a number that can disagree with the lockfile.
      #
      # The ORDER below is load-bearing and must stay: `setup-node`'s
      # `cache: pnpm` shells out to pnpm to find the store, so pnpm has to be on
      # PATH before it runs.
      #
      # `NODE_VERSION` and `.nvmrc` are a different question — they are the Node
      # the project runs on, not the Node these actions execute on.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: a dependency must not drift between local and CI.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Required gate, not advisory. This is what makes the architecture
      # boundaries in .dependency-cruiser.cjs real (ADR-0006).
      - name: Validate architecture boundaries
        run: pnpm graph:validate

      # The committed graph is what an agent reads instead of crawling the
      # repository (tools/project-graph/README.md). A stale one is worse than
      # none, because it is trusted. The generator emits no timestamp, so this
      # diff is empty unless the source tree actually moved.
      - name: Check the committed project graph is current
        run: pnpm graph:check

  # The admin panel as production serves it (#331, ADR-0052): the image built
  # from apps/admin/Dockerfile — the panel's deployable artefact — in front of
  # the API built from this commit, and the smoke test through it. It proves
  # the image builds, the headers and caching, the SPA fallback, the API's JSON
  # 404 under /api, and a whole admin session with its cookies.
  admin-proxy:
    name: Admin proxy smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'

    services:
      # The same images as the verify job above.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tezusta
          POSTGRES_PASSWORD: tezusta
          POSTGRES_DB: tezusta_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tezusta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tezusta:tezusta@localhost:5432/tezusta_smoke
      REDIS_URL: redis://localhost:6379
      # `test`, as in the verify job: the cookies are `Secure` under every
      # environment but `development`, which is the attribute under test.
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdefghijklmnop
      JWT_REFRESH_SECRET: ci-only-refresh-secret-zyxwvutsrqponmlkjihgfedcba
      # Every key the API refuses to start without, outside the verify job's
      # test harness. CI-only, like the pair above — they sign, seal and hash
      # nothing that leaves the runner. The TOTP key is 32 bytes, base64, as
      # env.schema.ts requires. Checked by booting the build with exactly this
      # environment and no .env file.
      JWT_ADMIN_ACCESS_SECRET: ci-only-admin-access-secret-abcdefghijklmnopqrstuvwxyz0123
      ADMIN_TOTP_ENCRYPTION_KEY: Y2ktb25seS1hZG1pbi10b3RwLWtleS0zMi1ieXRlcyE=
      # The two peppers the API also refuses to start without; each must
      # differ from every other secret here.
      RATE_LIMIT_KEY_SECRET: ci-only-rate-limit-pepper-0123456789abcdefghijklmnopq
      OTP_CODE_PEPPER: ci-only-otp-code-pepper-zyxwvutsrqponmlkjihgfedcba9876
      # The proxy runs with host networking, so the API sees it as 127.0.0.1.
      TRUST_PROXY: 127.0.0.1

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the API
        run: pnpm --filter api build

      - name: Migrate the database
        run: node apps/api/dist/infra/database/migrate.js

      # A fresh database, so the first super_admin's one-time link. Masked: it
      # opens nothing beyond this runner, but a credential is a credential.
      - name: Bootstrap the smoke admin
        id: bootstrap
        run: |
          link=$(node apps/api/dist/modules/admin/admin-bootstrap.cli.js --email smoke@tezusta.test --name Smoke | grep -o 'https\?://[^ ]*setup#[A-Za-z0-9_-]*')
          echo "::add-mask::$link"
          echo "link=$link" >> "$GITHUB_OUTPUT"

      - name: Start the API
        run: |
          nohup node apps/api/dist/main.js > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/health/live && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: Build the panel image
        run: docker build -f apps/admin/Dockerfile -t tezusta-admin:ci .

      - name: Start the proxy
        run: |
          docker run -d --name admin-proxy --network host -e API_UPSTREAM=http://127.0.0.1:3000 tezusta-admin:ci
          for attempt in $(seq 1 15); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          docker logs admin-proxy
          exit 1

      - name: Smoke test through the proxy
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8080
          SMOKE_SETUP_LINK: ${{ steps.bootstrap.outputs.link }}
        run: pnpm --filter admin test:smoke

      - name: Logs
        if: failure()
        run: |
          cat api.log || true
          docker logs admin-proxy || true

  # The API's production image (#406): built from apps/api/Dockerfile, the
  # API's deployable artefact, and exercised as a deploy would use it — the
  # one-off migrate command first, then the server — against the same
  # Postgres and Redis images as the verify job. Nothing here runs from the
  # source tree.
  api-image:
    name: API image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tezusta
          POSTGRES_PASSWORD: tezusta
          POSTGRES_DB: tezusta_image
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tezusta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tezusta:tezusta@127.0.0.1:5432/tezusta_image
      REDIS_URL: redis://127.0.0.1:6379
      # The image defaults to `production`, which refuses the stub providers;
      # CI has no real SMS or maps provider, so it says `test` explicitly.
      NODE_ENV: test
      # CI-only, in the admin proxy smoke's shape: they sign and hash nothing
      # that leaves the runner.
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdefghijklmnop
      JWT_REFRESH_SECRET: ci-only-refresh-secret-zyxwvutsrqponmlkjihgfedcba
      JWT_ADMIN_ACCESS_SECRET: ci-only-admin-access-secret-abcdefghijklmnopqrstuvwxyz0123
      ADMIN_TOTP_ENCRYPTION_KEY: Y2ktb25seS1hZG1pbi10b3RwLWtleS0zMi1ieXRlcyE=
      RATE_LIMIT_KEY_SECRET: ci-only-rate-limit-pepper-0123456789abcdefghijklmnopq
      OTP_CODE_PEPPER: ci-only-otp-code-pepper-zyxwvutsrqponmlkjihgfedcba9876
      # Handed to every `docker run` by name, so the values above stay the
      # one place they are written.
      API_ENV: >-
        -e DATABASE_URL -e REDIS_URL -e NODE_ENV -e JWT_ACCESS_SECRET
        -e JWT_REFRESH_SECRET -e JWT_ADMIN_ACCESS_SECRET -e ADMIN_TOTP_ENCRYPTION_KEY
        -e RATE_LIMIT_KEY_SECRET -e OTP_CODE_PEPPER

    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t tezusta-api:ci .

      - name: Image facts
        run: |
          docker image ls tezusta-api:ci
          user=$(docker run --rm tezusta-api:ci id -u)
          echo "runs as uid $user"
          test "$user" != "0"
          # The production closure only: no dev tooling made it in.
          docker run --rm tezusta-api:ci sh -c '! ls node_modules/typescript node_modules/vitest node_modules/expo 2>/dev/null'
          docker run --rm tezusta-api:ci node -e "require('sharp')"

      # Twice: the second run must find nothing to do and still exit 0.
      - name: Migrate with the image's one-off command
        run: |
          docker run --rm --network host $API_ENV tezusta-api:ci node dist/infra/database/migrate.js
          docker run --rm --network host $API_ENV tezusta-api:ci node dist/infra/database/migrate.js

      - name: Start the API from the image
        run: |
          docker run -d --name api --network host $API_ENV tezusta-api:ci
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/health/live && exit 0
            sleep 2
          done
          docker logs api
          exit 1

      - name: Smoke the running image
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health/ready)" = 200
          # A real route behind the guards: refused, not crashed.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/orders)" = 401
          # The image's own HEALTHCHECK reaches healthy.
          for attempt in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy

      # SIGTERM reaches Node as PID 1 and Nest's shutdown hooks close the
      # server: a clean exit, well inside the stop timeout, not a SIGKILL.
      - name: Stop on SIGTERM
        run: |
          start=$(date +%s)
          docker stop -t 30 api
          elapsed=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' api)
          echo "stopped in ${elapsed}s with exit code $code"
          test "$code" = 0
          test "$elapsed" -lt 25

      - name: Logs
        if: failure()
        run: docker logs api || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level high
