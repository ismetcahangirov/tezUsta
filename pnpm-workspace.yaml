packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Expo / React Native native-module resolution needs a hoisted tree.
# Ref: Expo "Work with monorepos" guide.
nodeLinker: hoisted

# Peers are resolved automatically; a genuine mismatch is caught by
# `pnpm typecheck` and the dependency-cruiser rules rather than by install.
autoInstallPeers: true
strictPeerDependencies: false

# pnpm applies a built-in `minimumReleaseAge` (24 hours) even when this file
# sets none: a version published within that window is rejected, including from
# an already-committed lockfile. The list below exempts the packages that were
# pinned deliberately at a just-published version after the compatibility
# review in docs/architecture/technology-stack.md.
#
# This list is load-bearing, not decoration. Removing an entry makes
# `pnpm install --frozen-lockfile` fail until that version ages out — verified
# by removing it. Do not raise `minimumReleaseAge` above the default either:
# Expo's metro packages publish continuously, and a 72-hour floor rejects the
# committed lockfile outright.
minimumReleaseAgeExclude:
  - dependency-cruiser@18.3.0
  - enhanced-resolve@5.25.1
  - lucide-react-native@1.46.0

# esbuild fetches its platform binary in a postinstall script; Vite — and so
# Storybook — will not start without it. @swc/core resolves its native binding
# the same way, and Vitest cannot transform apps/api without it: esbuild and oxc
# do not emit `design:paramtypes`, so Nest's constructor injection has no
# metadata to read inside a test.
allowBuilds:
  '@swc/core': true
  esbuild: true
  # `false`, deliberately. BullMQ packs job payloads with `msgpackr`, and
  # `msgpackr-extract` is an OPTIONAL native accelerator for it — msgpackr
  # falls back to its pure-JS path when the binding is absent, which is the
  # documented behaviour, not a degraded mode we invented. Declining the build
  # keeps `pnpm install` free of a node-gyp compile on every developer machine
  # and CI image for a queue whose payloads are a UUID and two integers.
  # Revisit only if a profile ever shows msgpack encoding on a hot path.
  msgpackr-extract: false
