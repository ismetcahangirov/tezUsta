packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Expo / React Native native-module resolution needs a hoisted tree.
# Ref: Expo "Work with monorepos" guide.
nodeLinker: hoisted

# Peers are resolved automatically; a genuine mismatch is caught by
# `pnpm typecheck` and the dependency-cruiser rules rather than by install.
autoInstallPeers: true
strictPeerDependencies: false

# pnpm applies a built-in `minimumReleaseAge` (24 hours) even when this file
# sets none: a version published within that window is rejected, including from
# an already-committed lockfile. The list below exempts the packages that were
# pinned deliberately at a just-published version after the compatibility
# review in docs/architecture/technology-stack.md.
#
# This list is load-bearing, not decoration. Removing an entry makes
# `pnpm install --frozen-lockfile` fail until that version ages out — verified
# by removing it. Do not raise `minimumReleaseAge` above the default either:
# Expo's metro packages publish continuously, and a 72-hour floor rejects the
# committed lockfile outright.
minimumReleaseAgeExclude:
  - dependency-cruiser@18.3.0
  - enhanced-resolve@5.25.1
  - lucide-react-native@1.46.0
  - expo-image-picker@57.0.19

# Security overrides for transitive packages whose parents still pin a range
# that resolves to an advised version. Each entry is the lowest patched release,
# raised within the same major so the parent's API contract is unchanged. Drop
# an entry once every parent's own range resolves past the advisory.
overrides:
  # GHSA-pqg4-j6r4-53mv (critical): command injection in quote(). Reached via
  # react-devtools-core, a React Native dev-time dependency.
  'shell-quote@1': 1.11.0
  # Recursion DoS (high) and quadratic expansion (moderate). Reached via
  # minimatch in ESLint and in Expo/Metro tooling.
  'brace-expansion@1': 1.1.21
  'brace-expansion@5': 5.0.12
  # GHSA-68fv-2mgg-jv7q (high): event-loop DoS. Reached via postcss in Vite,
  # Tailwind and jsdom, all build- or test-time.
  'source-map-js@1': 1.2.2

# Advisories with no patched release on the registry. `pnpm audit` and the CI
# audit read this list, so the two cannot disagree. No ignored version is in
# the API's runtime or the app bundle. Each entry is removed when a fix ships;
# the nightly audit is what notices it.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3, stack-exhaustion DoS on deeply nested patterns. No 3.0.4
    # is published (GitHub lists no first patched version). Reached only via
    # micromatch in build tooling — Tailwind's chokidar, Metro — matching
    # patterns written in this repository, not user input.
    - GHSA-vfj7-8cjw-p6xm
    # zod <4.6.6, memory exhaustion from the issues an oversized array collects.
    # The API's own zod is the patched 4.6.6, pinned exactly in
    # apps/api/package.json; that pin, not this list, keeps the API off a
    # vulnerable release. What this ignores is zod 3.25.76, the last 3.x (no
    # patched 3.x is published), reached only via @expo/cli, which validates its
    # own config on a developer machine or in EAS Build and is not bundled.
    - GHSA-mrhx-c7xc-m3w5

# esbuild fetches its platform binary in a postinstall script; Vite — and so
# Storybook — will not start without it. @swc/core resolves its native binding
# the same way, and Vitest cannot transform apps/api without it: esbuild and oxc
# do not emit `design:paramtypes`, so Nest's constructor injection has no
# metadata to read inside a test.
allowBuilds:
  '@swc/core': true
  esbuild: true
  # `false`, deliberately. BullMQ packs job payloads with `msgpackr`, and
  # `msgpackr-extract` is an OPTIONAL native accelerator for it — msgpackr
  # falls back to its pure-JS path when the binding is absent, which is the
  # documented behaviour, not a degraded mode we invented. Declining the build
  # keeps `pnpm install` free of a node-gyp compile on every developer machine
  # and CI image for a queue whose payloads are a UUID and two integers.
  # Revisit only if a profile ever shows msgpack encoding on a hot path.
  msgpackr-extract: false
