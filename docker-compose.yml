# ---------------------------------------------------------------------------
# TezUsta — local development environment
#
# Postgres MUST be the `postgis/postgis` image, not plain `postgres`: the
# first migration (EPIC 1) creates PostGIS-typed columns and the nearby-master
# radius queries (ADR-0003, docs/architecture/location-services.md) depend on
# the extension being installed in the image. A plain Postgres image cannot
# run that migration. The tag (`17-3.5`) must stay in step with the
# `postgres:` service image in .github/workflows/ci.yml — CI and local dev are
# expected to run the identical database.
#
# The credentials below are development-only. They are not secrets — this
# file is committed and the database is only reachable on localhost — but
# they must never be reused for a staging, production, or any other real
# environment.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: tezusta
      POSTGRES_PASSWORD: tezusta
      POSTGRES_DB: tezusta
    # Published on 15432, not 5432. A native PostgreSQL install — extremely
    # common on a developer machine, and present on at least one of ours —
    # already owns 5432, and a host process connecting there silently reaches
    # THAT server instead of this container: same port, wrong database, no
    # error that says so. The container still listens on 5432 internally, so
    # CI's service container (which has no such conflict) is unaffected.
    ports:
      - '15432:5432'
    volumes:
      - tezusta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tezusta -d tezusta']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - tezusta_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The call media server (ADR-0034, ADR-0038, issue #184). The API talks to
  # it over HTTP on 7880 — mint nothing there, it only answers RoomService
  # calls and the client signalling socket — and a phone would carry audio
  # over 7881/tcp or 7882/udp.
  #
  # Pinned to a patch tag, not `latest` or `v1.13`: both of those move, and a
  # media server that changes under an unchanged lockfile is the failure the
  # dependency policy exists to prevent. Keep it in step with the `livekit:`
  # service in .github/workflows/ci.yml.
  #
  # Configured entirely through the environment, not a mounted file or
  # `--dev`, so CI's service container — which cannot take a `command:` — runs
  # the identical server. `LIVEKIT_KEYS` is read by the binary itself
  # (`cmd/server/main.go`, flag `keys`). `--dev` is avoided on purpose: with
  # its built-in `devkey: secret` pair it binds to 127.0.0.1 *inside the
  # container*, where a published port cannot reach it.
  #
  # `UDP_PORT` multiplexes all media onto one UDP port. Without it LiveKit
  # picks ephemeral ports, which a container cannot publish in advance. A real
  # device on the LAN also needs `NODE_IP` set to this machine's LAN address,
  # or the server advertises the container's own IP — that belongs to the
  # device spike (#183), not to this file.
  #
  # The key pair is development-only, exactly like the Postgres credentials
  # above: committed, reachable on localhost only, and never to be reused for a
  # real environment. The secret is 32+ characters because LiveKit logs an
  # error for anything shorter outside `--dev`, and `env.schema.ts` refuses it.
  livekit:
    image: livekit/livekit-server:v1.13.7
    environment:
      LIVEKIT_KEYS: 'devkey: devsecret-tezusta-local-only-0123456789'
      UDP_PORT: '7882'
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    healthcheck:
      # The root path answers `OK`. busybox `wget` ships in the Alpine base the
      # image is built on.
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:7880']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The API's production image (#406), in the `prodlike` profile with the
  # panel's. One image, two roles: `api-migrate` applies migrations once and
  # exits, and `api` starts only after it succeeded — a server never migrates
  # on boot (`migrate.ts`). Both use `PRODLIKE_DATABASE` (default
  # `tezusta_smoke`), a throwaway database created as
  # docs/engineering/admin-bootstrap.md § 6 says, never the dev database.
  #
  # `NODE_ENV=test`: the image defaults to `production`, which refuses every
  # stub provider, and no real SMS or maps provider is configured locally.
  # The secrets are local-only defaults in the CI smoke's shape; an exported
  # variable overrides each.
  api-migrate:
    profiles: ['prodlike']
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
    image: tezusta-api:prodlike
    command: ['node', 'dist/infra/database/migrate.js']
    environment: &api-env
      NODE_ENV: test
      DATABASE_URL: postgresql://tezusta:tezusta@postgres:5432/${PRODLIKE_DATABASE:-tezusta_smoke}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-only-access-secret-0123456789abcdefghijk}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-only-refresh-secret-zyxwvutsrqponmlkjih}
      JWT_ADMIN_ACCESS_SECRET: ${JWT_ADMIN_ACCESS_SECRET:-local-only-admin-access-secret-abcdefghijklmnop}
      ADMIN_TOTP_ENCRYPTION_KEY: ${ADMIN_TOTP_ENCRYPTION_KEY:-bG9jYWwtb25seS10b3RwLWtleS0zMi1ieXRlcy0hISE=}
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-local-only-rate-limit-pepper-0123456789abcdefgh}
      OTP_CODE_PEPPER: ${OTP_CODE_PEPPER:-local-only-otp-code-pepper-zyxwvutsrqponmlkjihgfe}
      # The panel's proxy, at its fixed address below: without it every
      # request would share the proxy's rate-limit budget (CLAUDE.md § 21).
      TRUST_PROXY: 172.30.106.10
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default]

  api:
    profiles: ['prodlike']
    build: *api-build
    image: tezusta-api:prodlike
    environment: *api-env
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [default, edge]
    # Loopback only, like the proxy: for a smoke test and curl, not the LAN.
    ports:
      - '127.0.0.1:3000:3000'

  # The admin panel as production serves it (#331, ADR-0052): nginx with the
  # built panel at `/` and the API under `/api`, one origin. Off by default —
  # `docker compose --profile prodlike up -d admin-proxy` — because the dev
  # server (`pnpm --filter admin dev`) is what day-to-day work uses.
  #
  # Since #406 it fronts the `api` service above, on the `edge` network at a
  # fixed address the API trusts as its proxy. `API_UPSTREAM` still overrides
  # the upstream, for pointing the panel at an API run another way. The steps
  # for a full production-like run, and the smoke test against it, are in
  # docs/engineering/admin-bootstrap.md.
  admin-proxy:
    profiles: ['prodlike']
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:3000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.106.10
    # Loopback only: the proxy and the API behind it are not for the LAN.
    ports:
      - '127.0.0.1:8080:8080'

networks:
  # Between the panel's proxy and the API only, with a fixed subnet so the
  # proxy's address is known to `TRUST_PROXY`.
  edge:
    ipam:
      config:
        - subnet: 172.30.106.0/24

volumes:
  tezusta_pgdata:
  tezusta_redisdata:
