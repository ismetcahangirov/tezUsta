# Headers on every panel response (ADR-0052, #331). Included in each
# `location`, because an `add_header` in a location replaces — not extends —
# the ones above it.
#
# The CSP allows this origin and nothing else. The panel loads no third-party
# script, style, font or image: the Cahan Serif faces are bundled, the QR code is
# drawn locally as SVG, and the API is same-origin. No inline script or style
# is allowed, and none is needed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# Internal staff tooling behind a sign-in: nothing here is for a crawler.
add_header X-Robots-Tag "noindex, nofollow" always;
# The same set the API sends (#275).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Browsers ignore HSTS received over plain HTTP, so a local run is unaffected.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
