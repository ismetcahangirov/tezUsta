# Headers on every page response (ADR-0061 § 1), the admin panel's set
# (ADR-0052) less its robots tag. Included in each `location`, because an
# `add_header` in a location replaces — not extends — the ones above it.
#
# The CSP allows this origin and nothing else. The page loads no third-party
# script, style, font or image: the Inter faces are bundled, and the API is
# same-origin. Paying happens on the provider's own page, reached by a
# top-level navigation, which `connect-src` and `form-action` do not govern.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# No X-Robots-Tag: the page is public, and a master may find it by search.
# The same set the API sends (#275).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Browsers ignore HSTS received over plain HTTP, so a local run is unaffected.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
